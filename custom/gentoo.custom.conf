# Custom integration hooks and advanced options.
# This file is sourced by gentoo.conf and survives ./configure rewrites.

# Hyprland postinstall integration.
# The local kit is expected at: custom/hypr-gentoo-postinstall-kit
# inside this installer repository.
HYPR_POSTINSTALL_ENABLE=true
HYPR_POSTINSTALL_RUN_BOOTSTRAP=true
HYPR_POSTINSTALL_WITH_HYPROVERLAY=false
HYPR_POSTINSTALL_GPU_PROFILE="auto"      # auto|nvidia|amd|intel
HYPR_POSTINSTALL_MACHINE_PROFILE="auto"  # auto|desktop|laptop
# Optional hint used only in /root/HYPRLAND_POSTINSTALL_NEXT_STEPS.txt.
# Leave empty for a portable config and pass the real user at runtime:
#   hypr-postinstall-user-setup <username>
HYPR_POSTINSTALL_TARGET_USER=""

# Optional custom kernel pipeline (e.g. linux-tkg).
# Runs late in after_install, inside the target system.
# Keep KERNEL_TYPE as-is to retain a known-good fallback kernel until you verify custom kernel boot.
CUSTOM_KERNEL_PIPELINE_ENABLE=false
# Path is relative to this installer repo, e.g. "custom/kernel/install-linux-tkg.sh"
CUSTOM_KERNEL_SCRIPT_RELATIVE_PATH=""
# Additional args passed to your custom kernel script.
CUSTOM_KERNEL_SCRIPT_ARGS=()

after_install() {
	if [[ "$CUSTOM_KERNEL_PIPELINE_ENABLE" == "true" ]]; then
		[[ -n "$CUSTOM_KERNEL_SCRIPT_RELATIVE_PATH" ]] \
			|| die "CUSTOM_KERNEL_PIPELINE_ENABLE=true but CUSTOM_KERNEL_SCRIPT_RELATIVE_PATH is empty"

		local custom_kernel_script="$GENTOO_INSTALL_REPO_DIR/$CUSTOM_KERNEL_SCRIPT_RELATIVE_PATH"
		[[ -f "$custom_kernel_script" ]] \
			|| die "Custom kernel script not found at '$custom_kernel_script'"
		[[ -x "$custom_kernel_script" ]] || chmod +x "$custom_kernel_script"

		einfo "Running custom kernel pipeline: '$CUSTOM_KERNEL_SCRIPT_RELATIVE_PATH'"
		"$custom_kernel_script" "${CUSTOM_KERNEL_SCRIPT_ARGS[@]}" \
			|| die "Custom kernel pipeline failed"
	fi

	[[ "$HYPR_POSTINSTALL_ENABLE" == "true" ]] || return 0

	local kit_src="$GENTOO_INSTALL_REPO_DIR/custom/hypr-gentoo-postinstall-kit"
	local kit_dst="/root/hypr-gentoo-postinstall-kit"
	local target_user_hint="${HYPR_POSTINSTALL_TARGET_USER:-<username>}"

	if [[ ! -d "$kit_src" ]]; then
		ewarn "Hyprland kit not found at '$kit_src'. Skipping postinstall integration."
		return 0
	fi

	einfo "Preparing Hyprland postinstall kit in target system"
	rm -rf "$kit_dst" || die "Could not clear old hypr kit at '$kit_dst'"
	cp -a "$kit_src" "$kit_dst" || die "Could not copy hypr kit into target system"
	chmod +x "$kit_dst"/scripts/*.sh || die "Could not make hypr scripts executable"

	if [[ "$HYPR_POSTINSTALL_RUN_BOOTSTRAP" == "true" ]]; then
		local bootstrap_args=(
			--gpu "$HYPR_POSTINSTALL_GPU_PROFILE"
			--machine "$HYPR_POSTINSTALL_MACHINE_PROFILE"
		)
		[[ "$HYPR_POSTINSTALL_WITH_HYPROVERLAY" == "true" ]] && bootstrap_args+=(--with-hyproverlay)

		einfo "Running Hyprland root bootstrap (01-system-bootstrap.sh)"
		"$kit_dst/scripts/01-system-bootstrap.sh" "${bootstrap_args[@]}" \
			|| die "Hyprland root bootstrap failed"
	fi

	cat > /usr/local/sbin/hypr-postinstall-user-setup <<'EOF'
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -ne 1 ]]; then
	echo "Usage: hypr-postinstall-user-setup <username>"
	exit 1
fi

user="$1"
kit_dir="/root/hypr-gentoo-postinstall-kit"

if ! id "$user" >/dev/null 2>&1; then
	echo "User '$user' does not exist"
	exit 1
fi

su - "$user" -c "$kit_dir/scripts/02-user-setup.sh"
su - "$user" -c "$kit_dir/scripts/03-verify.sh"
echo "Hyprland user setup + verification completed for '$user'."
EOF
	chmod 0755 /usr/local/sbin/hypr-postinstall-user-setup \
		|| die "Could not install helper script /usr/local/sbin/hypr-postinstall-user-setup"

	cat > /root/HYPRLAND_POSTINSTALL_NEXT_STEPS.txt <<EOF
Hyprland postinstall kit is available at:
	$kit_dst

Root bootstrap executed during install: $HYPR_POSTINSTALL_RUN_BOOTSTRAP

After first boot:
1. Ensure your desktop user exists and has sudo/wheel access.
2. Run user setup + verification:
		 hypr-postinstall-user-setup $target_user_hint

Manual equivalent:
	su - $target_user_hint -c '$kit_dst/scripts/02-user-setup.sh'
	su - $target_user_hint -c '$kit_dst/scripts/03-verify.sh'
EOF
	chmod 0600 /root/HYPRLAND_POSTINSTALL_NEXT_STEPS.txt \
		|| die "Could not write /root/HYPRLAND_POSTINSTALL_NEXT_STEPS.txt"

	einfo "Hyprland postinstall integration complete"
}
