$mod = SUPER
$term = kitty
$menu = ~/.config/hypr/scripts/launcher.sh

# Core
bind = $mod, RETURN, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $term -e yazi
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen, 1
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, S, togglesplit
bind = $mod, ESCAPE, exec, hyprlock

# Focus movement (vim + arrows)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Resize windows
bind = $mod CTRL, H, resizeactive, -80 0
bind = $mod CTRL, L, resizeactive, 80 0
bind = $mod CTRL, K, resizeactive, 0 -80
bind = $mod CTRL, J, resizeactive, 0 80

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Useful floating rules
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(pavucontrol)$, size 920 620

# --- media keys addon start ---
bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh up
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh down
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh mute

bind = , XF86AudioPlay, exec, ~/.config/hypr/scripts/media.sh play-pause
bind = , XF86AudioPause, exec, ~/.config/hypr/scripts/media.sh play-pause
bind = , XF86AudioNext, exec, ~/.config/hypr/scripts/media.sh next
bind = , XF86AudioPrev, exec, ~/.config/hypr/scripts/media.sh prev
bind = , XF86AudioStop, exec, ~/.config/hypr/scripts/media.sh stop

# Desktop-safe: no-op if brightness device not present
bind = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
bind = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down
# --- media keys addon end ---

# Cycle Tokyo Night wallpaper
bind = $mod SHIFT, W, exec, ~/.config/hypr/scripts/wall-next.sh
bind = $mod CTRL, W, exec, ~/.config/hypr/scripts/wall-selector.sh
bind = $mod, X, exec, ~/.config/hypr/scripts/power-menu.sh
bind = $mod SHIFT, X, exec, ~/.config/hypr/scripts/theme-selector.sh

# Quick Settings panel
bind = $mod, C, exec, ~/.config/hypr/scripts/quick-settings.sh
bind = $mod, A, exec, ~/.config/hypr/scripts/control-center.sh
bind = $mod SHIFT, R, exec, ~/.config/hypr/scripts/safe-ui-reset.sh
bind = $mod, SPACE, exec, $menu --apps

# Screenshots
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh full
